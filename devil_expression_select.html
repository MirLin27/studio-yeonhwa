<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>드빌님 표정 선택</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#fffdf8;
  --pink:#e0788f;
  --pink2:#f4a7b9;
  --pale:#fff0f4;
  --pale2:#fde0e8;
  --text:#1a1a1a;
  --soft:#7a6070;
  --mint:#a8d8c8;
  --peach:#ffcba4;
  --lav:#d4b8e0;
  --line:#f0e0e8;
}
*{box-sizing:border-box;margin:0;padding:0}
body {
  background:var(--bg);
  color:var(--text);
  font-family:'Noto Sans KR',sans-serif;
  line-height:1.75;
  padding-bottom:92px;
}
.wrap {
  max-width:720px;
  margin:0 auto;
}
.hero {
  text-align:center;
  padding:42px 20px 34px;
  background:linear-gradient(145deg,#fde0e8,#fff0f4,#f5f0fa);
  border-radius:0 0 28px 28px;
}
.badge {
  display:inline-block;
  background:rgba(255,255,255,.86);
  border:1.5px solid var(--pink2);
  color:var(--pink);
  border-radius:999px;
  padding:5px 18px;
  font-size:12px;
  font-weight:700;
  margin-bottom:12px;
}
h1 {
  font-family:'Jua',sans-serif;
  font-size:30px;
  line-height:1.25;
}
h1 span{color:var(--pink)}
.hero p {
  margin-top:8px;
  color:var(--soft);
  font-size:13px;
}
.notice {
  margin:14px 16px 0;
  background:var(--pale);
  border-left:4px solid var(--pink);
  border-radius:0 16px 16px 0;
  padding:14px 16px;
  color:var(--soft);
  font-size:13px;
}
.notice b{color:var(--pink)}
.sec {
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:16px;
  margin:14px 16px 0;
  padding:20px;
  box-shadow:0 4px 18px rgba(224,120,143,.09);
}
.sec-title {
  font-family:'Jua',sans-serif;
  font-size:20px;
  margin-bottom:6px;
  display:flex;
  align-items:center;
  gap:8px;
}
.sec-desc {
  color:var(--soft);
  font-size:13px;
  padding-bottom:14px;
  margin-bottom:16px;
  border-bottom:1.5px dashed var(--pale2);
}
.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.card {
  border:1.5px solid var(--line);
  border-radius:16px;
  background:#fff;
  overflow:hidden;
  position:relative;
  transition:.2s ease;
}
.card.selected {
  border-color:var(--pink);
  box-shadow:0 0 0 4px var(--pale2);
  transform:translateY(-1px);
}
.thumb-wrap {
  position:relative;
  background:#f8f8f8;
}
.thumb {
  width:100%;
  height:210px;
  object-fit:cover;
  display:block;
}
.zoom-btn {
  position:absolute;
  right:8px;
  bottom:8px;
  border:none;
  background:rgba(26,26,26,.72);
  color:#fff;
  border-radius:999px;
  padding:6px 10px;
  font-size:12px;
  cursor:pointer;
}
.card-body {
  padding:12px;
}
.item-title {
  font-family:'Jua',sans-serif;
  font-size:16px;
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:6px;
}
.num {
  background:var(--pale2);
  color:var(--pink);
  min-width:30px;
  height:30px;
  border-radius:999px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
}
.price {
  display:inline-block;
  margin:2px 0 7px;
  background:#f5f0fa;
  color:#9060b0;
  border:1px solid #e8d7ef;
  border-radius:999px;
  padding:3px 10px;
  font-size:12px;
  font-weight:700;
}
.desc {
  min-height:42px;
  color:var(--soft);
  font-size:12.5px;
}
.select-btn {
  width:100%;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:var(--pale);
  color:var(--pink);
  font-family:'Jua',sans-serif;
  font-size:14px;
  padding:10px;
  cursor:pointer;
}
.card.selected .select-btn {
  background:var(--pink);
  color:#fff;
}
.memo {
  width:100%;
  min-height:108px;
  border:1.5px solid #f0d8e2;
  border-radius:14px;
  padding:12px;
  font-family:'Noto Sans KR',sans-serif;
  resize:vertical;
  outline:none;
  background:#fff;
  font-size:13px;
}
.memo:focus {
  border-color:var(--pink);
  box-shadow:0 0 0 3px var(--pale2);
}
.copy-area {
  position:sticky;
  bottom:0;
  z-index:10;
  background:rgba(255,253,248,.95);
  backdrop-filter:blur(8px);
  border-top:1.5px solid var(--line);
  padding:12px 16px;
  margin-top:18px;
}
.copy-inner {
  max-width:720px;
  margin:0 auto;
  display:flex;
  gap:8px;
}
.copy-inner button {
  flex:1;
  border:none;
  border-radius:14px;
  background:var(--pink);
  color:#fff;
  font-family:'Jua',sans-serif;
  font-size:15px;
  padding:12px;
  cursor:pointer;
}
.copy-inner button.secondary{background:var(--soft)}
.modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:30;
}
.modal.active{display:flex}
.modal-card {
  width:min(960px,100%);
  background:#fff;
  border-radius:18px;
  padding:12px;
  position:relative;
}
.modal-title {
  font-family:'Jua',sans-serif;
  font-size:17px;
  margin:4px 48px 10px 4px;
}
.modal-card img {
  width:100%;
  max-height:82vh;
  object-fit:contain;
  border-radius:12px;
  display:block;
  background:#f8f8f8;
}
.close {
  position:absolute;
  right:12px;
  top:10px;
  border:none;
  background:var(--pink);
  color:white;
  width:34px;
  height:34px;
  border-radius:999px;
  font-size:20px;
  cursor:pointer;
}
.toast {
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%);
  background:#3d2d35;
  color:white;
  border-radius:999px;
  padding:10px 16px;
  font-size:13px;
  display:none;
  z-index:50;
}
.toast.show{display:block}
@media(max-width:620px){
  .grid{grid-template-columns:1fr}
  .thumb{height:auto;max-height:430px;object-fit:contain}
  .copy-inner{flex-direction:column}
}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="badge">🌸 Studio Yeonhwa · 표정 선택 🌸</div>
    <h1>드빌님 <span>표정 선택</span></h1>
    <p>원하시는 표정을 확인하고 선택해주세요. 가격은 각 항목별 기준입니다 💗</p>
  </section>

  <div class="notice">
    <b>안내</b> · 정색/홍조처럼 색이 강하게 보이는 항목은 작업 전 확인용입니다. 실제 작업 후에는 안내된 것처럼 자연스럽게 조정됩니다.
  </div>

  <section class="sec">
    <div class="sec-title">😊 표정 옵션</div>
    <div class="sec-desc">각 표정은 중복 선택 가능합니다. 확대 버튼을 누르면 크게 확인할 수 있어요.</div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="sec">
    <div class="sec-title">💌 추가 요청 사항</div>
    <div class="sec-desc">표정 색감, 강도, 위치 등 추가로 원하시는 부분이 있다면 적어주세요.</div>
    <textarea id="memo" class="memo" placeholder="예) 홍조는 조금 연하게 / 눈물은 한쪽만 / 고양이 눈은 조금 더 작게 등"></textarea>
  </section>
</div>

<div class="copy-area">
  <div class="copy-inner">
    <button onclick="copyResult()">선택 내용 복사하기</button>
    <button class="secondary" onclick="resetSelect()">선택 초기화</button>
  </div>
</div>

<div class="modal" id="modal" onclick="closeModal(event)">
  <div class="modal-card">
    <button class="close" onclick="hideModal()">×</button>
    <div class="modal-title" id="modalTitle"></div>
    <img id="modalImg" src="" alt="">
  </div>
</div>
<div class="toast" id="toast">복사 완료!</div>

const selected = new Set();

function makeCard(item) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.num = item.num;
  card.innerHTML = `
    <div class="thumb-wrap">
      <img class="thumb" src="${item.src}" alt="${item.num}번 ${item.name}">
      <button class="zoom-btn" type="button">🔍 확대</button>
    </div>
    <div class="card-body">
      <div class="item-title"><span class="num">${item.num}</span>${item.name}</div>
      <div class="price">${item.price}</div>
      <div class="desc">${item.desc || '표정 옵션입니다.'}</div>
      <button class="select-btn" type="button">선택하기</button>
    </div>
  `;
  card.querySelector('.zoom-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    showModal(item);
  });
  card.querySelector('.select-btn').addEventListener('click', () => toggleSelect(card, item.num));
  return card;
}

function toggleSelect(card, num) {
  if(selected.has(num)) {
    selected.delete(num);
    card.classList.remove('selected');
    card.querySelector('.select-btn').textContent = '선택하기';
  } else {
    selected.add(num);
    card.classList.add('selected');
    card.querySelector('.select-btn').textContent = '선택됨 💗';
  }
}

function showModal(item) {
  document.getElementById('modalTitle').textContent = `${item.num}번 · ${item.name} / ${item.price}`;
  document.getElementById('modalImg').src = item.src;
  document.getElementById('modal').classList.add('active');
}
function hideModal() {
  document.getElementById('modal').classList.remove('active');
}
function closeModal(e) {
  if(e.target.id === 'modal') hideModal();
}
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') hideModal();
});

function copyResult() {
  const list = [...selected].sort((a,b)=>Number(a)-Number(b)).map(num => {
    const item = ITEMS.find(x => x.num === num);
    return `- ${item.num}번 ${item.name} / ${item.price}${item.desc ? ' (' + item.desc + ')' : ''}`;
  });
  const memo = document.getElementById('memo').value.trim();
  let text = `드빌님 표정 선택 내용\n\n`;
  text += list.length ? `[선택한 표정]\n${list.join('\n')}\n` : `[선택한 표정]\n선택 없음\n`;
  text += `\n[추가 요청 사항]\n${memo || '없음'}`;
  navigator.clipboard.writeText(text).then(() => showToast('복사 완료!')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    showToast('복사 완료!');
  });
}

function resetSelect() {
  selected.clear();
  document.querySelectorAll('.card').forEach(card => {
    card.classList.remove('selected');
    card.querySelector('.select-btn').textContent = '선택하기';
  });
  document.getElementById('memo').value = '';
  showToast('초기화 완료!');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1600);
}

const grid = document.getElementById('grid');
ITEMS.forEach(item => grid.appendChild(makeCard(item)));
</script>
